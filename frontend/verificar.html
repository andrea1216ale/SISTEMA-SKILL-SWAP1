<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verificar correo | Skill Swap</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/login-form.css">
  <link rel="stylesheet" href="css/register-form.css">
</head>
<body data-page="verify">
  <main class="login-page">
    <section class="login-access" aria-labelledby="verifyTitle">
      <div class="login-access__inner">
        <header class="login-access__header">
          <span class="login-access__kicker">Un último paso</span>
          <h2 id="verifyTitle">Verifica tu correo</h2>
          <p>Enviamos un código de 6 dígitos. Caduca en 10 minutos.</p>
        </header>

        <form id="verifyForm" class="login-form">
          <label for="verifyEmail">Correo electrónico</label>
          <div class="login-field login-field--plain">
            <input id="verifyEmail" type="email" autocomplete="email" required>
          </div>
          <label for="verifyCode">Código de verificación</label>
          <div class="login-field login-field--plain">
            <input id="verifyCode" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" placeholder="000000" required>
          </div>
          <p id="verifyMessage" class="verify-message" role="status" aria-live="polite"></p>
          <button id="verifyButton" class="login-submit" type="submit">Verificar cuenta</button>
          <button id="resendButton" class="verify-secondary" type="button">Reenviar código</button>
          <p class="login-register"><a href="login.html">Volver al inicio de sesión</a></p>
        </form>
      </div>
    </section>
  </main>
  <script type="module" src="js/pages/verify-page.js"></script>
</body>
</html>
